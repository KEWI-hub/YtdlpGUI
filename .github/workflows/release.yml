# สร้าง YtdlpGUI.exe แล้วออก Release ให้อัตโนมัติ เมื่อ push tag เวอร์ชัน (เช่น v1.1.0)
# Builds YtdlpGUI.exe and publishes a Release automatically when a version tag is pushed.
name: Build & Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check APP_VERSION matches the tag
        shell: pwsh
        run: |
          $v = (Select-String -Path ytdlp_gui.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "APP_VERSION ($v) does not match tag ${{ github.ref_name }}" }

      - name: Install build requirements
        run: python -m pip install -r requirements.txt

      - name: Build YtdlpGUI.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --collect-all curl_cffi --hidden-import websocket --name YtdlpGUI --distpath dist ytdlp_gui.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: YtdlpGUI ${{ github.ref_name }}
          files: dist/YtdlpGUI.exe
          generate_release_notes: true
