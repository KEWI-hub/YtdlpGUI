<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { width: 340px; margin: 0; padding: 10px 12px 12px;
         font: 13px/1.45 "Segoe UI", Tahoma, system-ui, sans-serif; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  .hint { opacity: .75; margin: 0 0 10px; }
  .item { border: 1px solid rgba(128,128,128,.35); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .name { font-weight: 600; word-break: break-all; margin-bottom: 2px; }
  .host { opacity: .7; font-size: 12px; word-break: break-all; margin-bottom: 7px; }
  .res { display: flex; flex-wrap: wrap; gap: 5px; }
  button { font: inherit; padding: 4px 9px; border-radius: 5px; cursor: pointer;
           border: 1px solid rgba(128,128,128,.5); background: transparent; color: inherit; }
  button:hover { background: rgba(128,128,128,.18); }
  button.best { border-color: #2574EB; color: #2574EB; font-weight: 600; }
  .page { width: 100%; margin-top: 2px; }
  .done { color: #219E54; margin: 6px 0 0; }
  .err { color: #D93025; margin: 6px 0 0; }
</style>
</head>
<body>
  <h1>YtdlpGUI</h1>
  <div id="body"></div>
  <button id="page" class="page">ส่งลิงก์หน้าเว็บนี้ / Send this page link</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
